# muxmesh — TPM entry point.
#
# TPM (tpm) loads <plugin-root>/<name>.tmux.conf as the plugin's entry hook,
# so this file must live at the repo root. The real key bindings live in
# misc/ (the repo root belongs to Cargo). This file only forwards there.
#
# Install with tpm (~/.tmux.conf):
#   set -g @plugin 'Armanoide/muxmesh'
#   run '~/.tmux/plugins/tpm/tpm'
#
# Without tpm, source misc/muxmesh.tmux.conf DIRECTLY (not this file):
#   source-file ~/path/to/dev/muxmesh/misc/muxmesh.tmux.conf

# Resolve this plugin's directory and source the real bindings. tpm exports
# TMUX_PLUGIN_MANAGER_PATH while sourcing plugins; the well-known default
# covers manual sources. run-shell -b: no client needed. Quoting note: tmux
# passes the argument to /bin/sh -c, so keep it single-quoted (#{...} would
# otherwise be expanded by tmux's format engine and choke on ${VAR:-}).
run-shell -b 'd="${TMUX_PLUGIN_MANAGER_PATH:-$HOME/.tmux/plugins/}muxmesh"; tmux set-environment -g PATH "$d/bin:$PATH"; if [ -f "$d/misc/muxmesh.tmux.conf" ]; then tmux source-file "$d/misc/muxmesh.tmux.conf"; fi'
