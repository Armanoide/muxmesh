# muxmesh — TPM entry point.
#
# TPM (tpm) loads <plugin-root>/<name>.tmux.conf as the plugin's entry hook,
# so this file must live at the repo root. The real key bindings live in
# misc/ (the repo root belongs to Cargo). This file only forwards there.
#
# Install with tpm (~/.tmux.conf):
#   set -g @plugin 'Armanoide/muxmesh'
#   run '~/.tmux/plugins/tpm/tpm'
#
# Without tpm, source misc/muxmesh.tmux.conf DIRECTLY (not this file):
#   source-file ~/path/to/dev/muxmesh/misc/muxmesh.tmux.conf

# Resolve this plugin's directory: tpm sets @plugin-path while sourcing its
# plugins; fall back to the well-known tpm clone dir, then warn.
if-shell -b 'test -d "#{@plugin-path}/misc"' { \
  source-file "#{@plugin-path}/misc/muxmesh.tmux.conf"; \
} { \
  if-shell -b 'test -d "$HOME/.tmux/plugins/muxmesh/misc"' { \
    source-file "$HOME/.tmux/plugins/muxmesh/misc/muxmesh.tmux.conf"; \
  } { \
    display-message "muxmesh: plugin dir not found — source misc/muxmesh.tmux.conf directly"; \
  } \
}
