# muxmesh — tmux plugin (tpm entry point, everything lives here).
#
# Install via tpm (~/.tmux.conf):
#   set -g @plugin 'Armanoide/muxmesh'
#   run '~/.tmux/plugins/tpm/tpm'
#
# No forwarding, no if-shell in the key binding: F10 calls one binary and
# ALL logic (armed check, hidden-state, BarHide/BarShow choice) lives in
# Rust (muxmesh-cli bar-toggle). The badge poller runs embedded in
# muxmesh-hub / muxmesh-agent, so the only tmux-side pieces are:
#   1. bin/ on tmux's PATH (so F10 finds muxmesh-cli without an install)
#   2. the F10 binding itself

# Expose <plugin>/bin (muxmesh-cli launcher -> target/release) to tmux and
# every run-shell it spawns. Quoting: single quotes keep shell expansion out
# of tmux's format engine (#{...} chokes on ${VAR:-default}).
run-shell -b 'd="${TMUX_PLUGIN_MANAGER_PATH:-$HOME/.tmux/plugins/}muxmesh"; tmux set-environment -g PATH "$d/bin:$PATH"'

# F10: one-bar toggle against the armed remote host (Rust decides everything).
bind-key -n F10 run-shell "muxmesh-cli bar-toggle"
