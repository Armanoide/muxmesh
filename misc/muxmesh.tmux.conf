# muxmesh — tmux key bindings for the driver machine.
# Source from your ~/.tmux.conf:  source-file ~/path/to/misc/muxmesh.tmux.conf
#
# Requires muxmesh-cli on PATH and the badge poller running (`muxmesh-cli poll`),
# which sets @muxmesh-armed-win on windows holding a live `ssh <host>` to an
# armed+fresh agent. Keys fire ONLY when the current window is armed; the
# target host comes from `muxmesh-cli armed-host` (the ssh in this window).

# F8: new window on the remote host
bind-key -n F8 if-shell -F "#{?@muxmesh-armed-win}" \
  "run-shell \"sh -c 'muxmesh-cli send \\\"$(muxmesh-cli armed-host)\\\" NewWindow main'\"" \
  "display-message 'muxmesh: no armed window'"

# F9: new session on the remote host (name = timestamp)
bind-key -n F9 if-shell -F "#{?@muxmesh-armed-win}" \
  "run-shell \"sh -c 'muxmesh-cli send \\\"$(muxmesh-cli armed-host)\\\" NewSession s$(date +%H%M)'\"" \
  "display-message 'muxmesh: no armed window'"

# F10: attach or detach the remote host (toggle)
bind-key -n F10 if-shell -F "#{?@muxmesh-armed-win}" \
  "run-shell \"sh -c 'muxmesh-cli send \\\"$(muxmesh-cli armed-host)\\\" AttachOrDetach main'\"" \
  "display-message 'muxmesh: no armed window'"
