# muxmesh — tmux key binding for the driver machine.
# Source from your ~/.tmux.conf:  source-file ~/path/to/dev/muxmesh/misc/muxmesh.tmux.conf
#
# Requires muxmesh-cli on PATH and the badge poller running (`muxmesh-cli poll`),
# which sets @muxmesh-armed-win on windows holding a live `ssh <host>` to an
# armed+fresh agent.
#
# F10 = one-bar toggle (ports the tmux-remote fork semantics to the /cmd
# pivot). Pressed in an ARMED window (you are ssh'd into a remote tmux):
#   not hidden -> POST /cmd BarHide  -> remote `tmux set -g status off`
#   hidden     -> POST /cmd BarShow  -> remote `tmux set -g status on`
# The toggle state lives in the local window option @muxmesh-bar-hidden.
# Inert (notice only) in a non-armed window.

# F10: toggle the remote status bar (one-bar protocol)
bind-key -n F10 if-shell -F "#{?@muxmesh-armed-win}" { \
  if-shell -F "#{?@muxmesh-bar-hidden}" { \
    run-shell "sh -c 'H=\$(muxmesh-cli armed-host) && muxmesh-cli send \"\$H\" BarShow main'"; \
    set -w -u @muxmesh-bar-hidden; \
  } { \
    run-shell "sh -c 'H=\$(muxmesh-cli armed-host) && muxmesh-cli send \"\$H\" BarHide main'"; \
    set -w @muxmesh-bar-hidden 1; \
  } \
} { \
  display-message "muxmesh: no armed window"; \
}
